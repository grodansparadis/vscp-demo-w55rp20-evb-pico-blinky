name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mqtt: ["", "192.168.1.9"]
    steps:
      - uses: actions/checkout@v5
      - name: Install the ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - name: Get the Pico SDK
        run: git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git ${{ runner.temp }}/pico-sdk && git -C ${{ runner.temp }}/pico-sdk submodule update --init --depth 1 lib/tinyusb
      - name: Build
        run: |
          cmake -B build -G Ninja -DPICO_SDK_PATH=${{ runner.temp }}/pico-sdk -DBLINKY_MQTT_BROKER="${{ matrix.mqtt }}"
          cmake --build build
      - uses: actions/upload-artifact@v4
        if: matrix.mqtt == ''
        with:
          name: vscp-blinky
          path: build/vscp-blinky.uf2
